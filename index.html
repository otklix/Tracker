<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 День рождения</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }
        
        /* Фон с эмодзи */
        .bg-emojis {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .float-emoji {
            position: absolute;
            font-size: 2.5rem;
            opacity: 0.4;
            animation: floatUp linear infinite;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            filter: drop-shadow(0 0 10px rgba(255, 200, 0, 0.2));
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-10vh) rotate(720deg) scale(1.2); opacity: 0; }
        }

        /* Карточка с подсветкой */
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 56px;
            padding: 40px 30px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 50px rgba(255, 100, 100, 0.15);
            text-align: center;
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: glowPulse 4s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 107, 107, 0.1); }
            50% { box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 80px rgba(255, 107, 107, 0.3); }
        }

        h1 { font-size: 2.8rem; font-weight: 600; color: #fff; margin-bottom: 5px; text-shadow: 0 0 20px rgba(255, 100, 100, 0.3); }
        h1 span { color: #ff6b6b; text-shadow: 0 0 30px rgba(255, 107, 107, 0.5); }
        .subtitle { color: #b0b0c0; margin-bottom: 30px; }
        
        .input-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 35px; }
        .input-group input {
            padding: 16px 24px; border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05); color: #fff; font-size: 1rem; outline: none;
            flex: 1 1 180px; min-width: 150px; transition: 0.3s;
        }
        .input-group input:focus { border-color: #ff6b6b; box-shadow: 0 0 20px rgba(255, 107, 107, 0.2); }
        .input-group input::placeholder { color: #8888aa; }
        
        .input-group button {
            padding: 16px 40px; border-radius: 40px; border: none;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: #fff; font-weight: 600; font-size: 1.1rem; cursor: pointer;
            box-shadow: 0 8px 30px rgba(238, 90, 36, 0.3);
            transition: 0.3s; flex: 0 1 auto;
            animation: buttonGlow 3s ease-in-out infinite;
        }
        @keyframes buttonGlow {
            0%, 100% { box-shadow: 0 8px 30px rgba(238, 90, 36, 0.3); }
            50% { box-shadow: 0 8px 50px rgba(238, 90, 36, 0.7); }
        }
        .input-group button:hover { transform: translateY(-2px) scale(1.02); }
        .input-group button:active { transform: scale(0.96); }
        
        .countdown { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 10px 0 15px; }
        .time-box {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 24px; padding: 12px 8px; min-width: 70px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2), 0 0 15px rgba(255, 100, 100, 0.05);
            transition: 0.3s;
        }
        .time-box:hover { border-color: rgba(255, 107, 107, 0.3); box-shadow: 0 4px 30px rgba(255, 100, 100, 0.15); }
        .time-box span { display: block; font-size: 3.4rem; font-weight: 700; color: #fff; line-height: 1; text-shadow: 0 0 10px rgba(255, 255, 255, 0.1); }
        .time-box small { display: block; font-size: 0.75rem; color: #a0a0b0; margin-top: 4px; }
        .ms-box { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 107, 107, 0.2); }
        .ms-box span { font-size: 2.8rem; color: #ff6b6b; text-shadow: 0 0 20px rgba(255, 107, 107, 0.4); }
        
        .message {
            margin-top: 30px; font-size: 1.5rem; font-weight: 500; color: #fff;
            padding: 12px 20px; border-radius: 40px; display: inline-block;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
        .message .highlight { color: #ff6b6b; font-weight: 700; text-shadow: 0 0 20px rgba(255, 107, 107, 0.5); }

        /* ========== МОДАЛЬНОЕ ОКНО ========== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center;
            z-index: 9999; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #1a1a2e; border-radius: 48px; padding: 50px 40px;
            max-width: 450px; width: 100%; text-align: center;
            border: 1px solid rgba(255, 107, 107, 0.3);
            box-shadow: 0 40px 80px rgba(0,0,0,0.8), 0 0 60px rgba(255, 107, 107, 0.15);
            animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-box h2 { font-size: 2.8rem; color: #ff6b6b; margin-bottom: 15px; text-shadow: 0 0 30px rgba(255, 107, 107, 0.4); }
        .modal-box p { font-size: 1.2rem; color: #d0d0e0; line-height: 1.6; margin-bottom: 25px; }
        .modal-box button {
            padding: 14px 40px; border-radius: 40px; border: none;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: #fff; font-weight: 600; font-size: 1.2rem; cursor: pointer;
            transition: 0.3s; box-shadow: 0 8px 30px rgba(238, 90, 36, 0.3);
            animation: buttonGlow 3s ease-in-out infinite;
        }
        .modal-box button:hover { transform: scale(1.05); }

        @keyframes popUp {
            0% { transform: scale(0.5) rotate(-5deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .note { margin-top: 20px; font-size: 0.8rem; color: #666680; }
    </style>
</head>
<body>
    <!-- Фон с анимированными эмодзи -->
    <div class="bg-emojis" id="emojiContainer"></div>

    <!-- Главная карточка -->
    <div class="card">
        <h1>🎂 День <span>рождения</span></h1>
        <p class="subtitle">Обратный отсчёт до главного дня</p>

        <div class="input-group">
            <input type="datetime-local" id="birthdayInput">
            <button id="startBtn">🎈 Запустить</button>
        </div>

        <div class="countdown">
            <div class="time-box"><span id="days">0</span><small>Дней</small></div>
            <div class="time-box"><span id="hours">00</span><small>Часов</small></div>
            <div class="time-box"><span id="minutes">00</span><small>Минут</small></div>
            <div class="time-box"><span id="seconds">00</span><small>Секунд</small></div>
            <div class="time-box ms-box"><span id="milliseconds">000</span><small>Мс</small></div>
        </div>

        <div class="message" id="message">⌛ Ожидание...</div>
        <div class="note">✨ Летающие эмодзи и неоновая подсветка</div>
    </div>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <h2>🎉 С днём рождения!</h2>
            <p>Пусть этот день будет полон радости, счастья и любви!<br>☀️ Свети ярко! 🌟</p>
            <button id="closeModalBtn">Спасибо! ✨</button>
        </div>
    </div>

    <script>
        // Генерация летающих эмодзи
        const emojis = ['🎂', '🎈', '🎁', '🥳', '✨', '🎊', '💫', '🌟', '🎉', '🍰'];
        const container = document.getElementById('emojiContainer');
        
        for (let i = 0; i < 30; i++) {
            const span = document.createElement('span');
            span.className = 'float-emoji';
            span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            span.style.left = Math.random() * 100 + '%';
            span.style.fontSize = (Math.random() * 2 + 1.5) + 'rem';
            span.style.animationDuration = (Math.random() * 15 + 10) + 's';
            span.style.animationDelay = (Math.random() * 20) + 's';
            container.appendChild(span);
        }

        // Логика таймера
        let timerInterval;

        function fireConfetti() {
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    confetti({
                        particleCount: 150,
                        spread: 70,
                        origin: { y: 0.6, x: Math.random() * 0.8 + 0.1 }
                    });
                }, i * 300);
            }
            setTimeout(() => {
                confetti({
                    particleCount: 80,
                    spread: 100,
                    origin: { y: 0.5 },
                    startVelocity: 30,
                    colors: ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6bb5']
                });
            }, 900);
        }

        function updateTimer(targetDate) {
            const now = new Date();
            const diff = targetDate - now;

            if (diff <= 0) {
                clearInterval(timerInterval);
                document.getElementById('message').innerHTML = '🎉 <span class="highlight">С днём рождения!</span> 🎉';
                document.getElementById('days').textContent = '0';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                document.getElementById('milliseconds').textContent = '000';
                
                fireConfetti();
                document.getElementById('modal').classList.add('active');
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            const milliseconds = Math.floor(diff % 1000);

            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
            document.getElementById('milliseconds').textContent = milliseconds.toString().padStart(3, '0');
            document.getElementById('message').innerHTML = `⌛ Осталось <span class="highlight">${days}</span> дней`;
        }

        document.getElementById('startBtn').addEventListener('click', function() {
            const input = document.getElementById('birthdayInput');
            let dateValue = input.value;

            if (!dateValue) {
                alert('Выберите дату!');
                return;
            }

            let targetDate = new Date(dateValue);
            const now = new Date();

            if (targetDate.getFullYear() === now.getFullYear() && targetDate < now) {
                targetDate.setFullYear(targetDate.getFullYear() + 1);
                input.value = targetDate.toISOString().slice(0, 16);
            }

            if (isNaN(targetDate.getTime())) {
                alert('Некорректная дата!');
                return;
            }

            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('modal').classList.remove('active');
            
            updateTimer(targetDate);
            timerInterval = setInterval(() => updateTimer(targetDate), 10);
        });

        document.getElementById('closeModalBtn').addEventListener('click', function() {
            document.getElementById('modal').classList.remove('active');
        });
        
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('active');
            }
        });

        // Дефолтная дата (через 7 дней)
        const defaultDate = new Date();
        defaultDate.setDate(defaultDate.getDate() + 7);
        document.getElementById('birthdayInput').value = defaultDate.toISOString().slice(0, 16);
    </script>
</body>
</html>
