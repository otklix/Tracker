<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Таймер с миллисекундами</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #0b0b0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #00ffcc;
            padding: 20px;
            overflow: hidden;
        }
        .card {
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 60px;
            padding: 40px 30px;
            max-width: 700px;
            width: 100%;
            border: 1px solid rgba(0, 255, 204, 0.25);
            box-shadow: 0 0 60px rgba(0, 255, 204, 0.1);
            text-align: center;
            position: relative;
        }
        /* Неоновая полоска сверху */
        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 20%;
            right: 20%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #00ffcc, transparent);
            border-radius: 50%;
            filter: blur(2px);
        }
        h1 {
            font-size: 2rem;
            font-weight: 400;
            color: #fff;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }
        .subtitle {
            color: #8899aa;
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-bottom: 25px;
            opacity: 0.7;
        }
        .input-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .input-group input {
            padding: 14px 20px;
            border-radius: 40px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            background: rgba(0, 0, 0, 0.5);
            color: #00ffcc;
            font-size: 1rem;
            outline: none;
            flex: 1 1 180px;
            min-width: 150px;
            transition: 0.3s;
            font-family: 'Courier New', monospace;
        }
        .input-group input:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
        }
        .input-group button {
            padding: 14px 30px;
            border-radius: 40px;
            border: none;
            background: #00ffcc;
            color: #0b0b0f;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex: 0 1 auto;
        }
        .input-group button:hover {
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.6);
            transform: scale(1.02);
        }
        .countdown {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 10px 0 5px;
        }
        .time-box {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            padding: 15px 8px;
            min-width: 70px;
            border: 1px solid rgba(0, 255, 204, 0.15);
            box-shadow: inset 0 0 30px rgba(0, 255, 204, 0.03);
        }
        .time-box span {
            display: block;
            font-size: 3rem;
            font-weight: 700;
            color: #00ffcc;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            line-height: 1;
        }
        .time-box small {
            display: block;
            font-size: 0.7rem;
            color: #8899aa;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        /* Блок миллисекунд (выделяем) */
        .ms-box {
            background: rgba(0, 255, 204, 0.05);
            border: 1px solid rgba(0, 255, 204, 0.3);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.05);
            min-width: 80px;
        }
        .ms-box span {
            font-size: 2.8rem;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }
        .message {
            margin-top: 25px;
            font-size: 1.4rem;
            font-weight: 300;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }
        .message .highlight {
            color: #00ffcc;
        }
        .note {
            margin-top: 15px;
            font-size: 0.7rem;
            color: rgba(136, 153, 170, 0.5);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>⏱️ Обратный отсчёт</h1>
        <p class="subtitle">До твоего главного дня</p>

        <div class="input-group">
            <input type="datetime-local" id="birthdayInput">
            <button id="startBtn">Запуск</button>
        </div>

        <div class="countdown">
            <div class="time-box"><span id="days">0</span><small>Дней</small></div>
            <div class="time-box"><span id="hours">00</span><small>Часов</small></div>
            <div class="time-box"><span id="minutes">00</span><small>Минут</small></div>
            <div class="time-box"><span id="seconds">00</span><small>Секунд</small></div>
            <div class="time-box ms-box"><span id="milliseconds">000</span><small>Мс</small></div>
        </div>

        <div class="message" id="message">⚡ Ожидание <span class="highlight">запуска</span></div>
        <div class="note">* Обновление 1000 раз в секунду</div>
    </div>

    <script>
        let timerInterval;

        function updateTimer(targetDate) {
            const now = new Date();
            const diff = targetDate - now;

            if (diff <= 0) {
                clearInterval(timerInterval);
                document.getElementById('message').innerHTML = '🎉 <span class="highlight">С ДНЁМ РОЖДЕНИЯ!</span> 🎉';
                document.getElementById('days').textContent = '0';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                document.getElementById('milliseconds').textContent = '000';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            const milliseconds = Math.floor(diff % 1000);

            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
            document.getElementById('milliseconds').textContent = milliseconds.toString().padStart(3, '0');
            document.getElementById('message').innerHTML = `⌛ Осталось <span class="highlight">${days}</span> дней`;
        }

        document.getElementById('startBtn').addEventListener('click', function() {
            const input = document.getElementById('birthdayInput');
            const dateValue = input.value;

            if (!dateValue) {
                alert('Выбери дату и время!');
                return;
            }

            const targetDate = new Date(dateValue);
            if (isNaN(targetDate.getTime())) {
                alert('Некорректная дата!');
                return;
            }

            if (timerInterval) clearInterval(timerInterval);
            updateTimer(targetDate);
            // Обновляем каждые 10 миллисекунд, чтобы было плавно и красиво
            timerInterval = setInterval(() => updateTimer(targetDate), 10);
        });

        // Дефолт: через 7 дней
        const defaultDate = new Date();
        defaultDate.setDate(defaultDate.getDate() + 7);
        document.getElementById('birthdayInput').value = defaultDate.toISOString().slice(0, 16);
    </script>
</body>
</html>
